
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Between Us | Private Login</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  min-height: 100vh;
  background: radial-gradient(ellipse at top, #35194e, #130b21 65%, #05040d);
  color: #f5eaff;
  font-family: Georgia, serif;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 22px;
}

.stars {
  position: fixed;
  inset: 0;
  pointer-events: none;
  background-image:
    radial-gradient(2px 2px at 20% 30%, #fff, transparent),
    radial-gradient(2px 2px at 70% 20%, #fff, transparent),
    radial-gradient(2px 2px at 40% 80%, #fff, transparent);
  background-size: 230px 230px;
  opacity: .45;
}

.container {
  width: 100%;
  max-width: 420px;
  text-align: center;
  position: relative;
  z-index: 1;
}

.tagline {
  font-size: 11px;
  letter-spacing: 5px;
  color: #c99aff;
  margin-bottom: 25px;
}

.heart {
  font-size: 55px;
  margin-bottom: 15px;
  animation: pulse 2s infinite;
}

@keyframes pulse {
  50% { transform: scale(1.15); }
}

h1 {
  font-size: 46px;
  font-weight: normal;
  margin-bottom: 15px;
}

.subtitle {
  color: #c9b8dc;
  line-height: 1.8;
  margin-bottom: 35px;
}

.card {
  padding: 30px 23px;
  border: 1px solid #76539b;
  border-radius: 25px;
  background: #ffffff0b;
  box-shadow: 0 0 35px #a855f722;
  backdrop-filter: blur(12px);
}

h2 {
  font-weight: normal;
  font-size: 27px;
  margin-bottom: 12px;
}

.card p {
  color: #c9b8dc;
  font-size: 14px;
  margin-bottom: 25px;
}

label {
  display: block;
  text-align: left;
  margin: 17px 0 9px;
  font-size: 14px;
}

input {
  width: 100%;
  padding: 15px;
  border-radius: 12px;
  border: 1px solid #76539b;
  background: #171022;
  color: white;
  font-size: 15px;
  outline: none;
}

input:focus {
  border-color: #d58bff;
}

button {
  width: 100%;
  padding: 16px;
  margin-top: 25px;
  border: none;
  border-radius: 35px;
  background: linear-gradient(100deg, #a35df2, #df83cc);
  color: white;
  font-size: 16px;
  cursor: pointer;
}

.notice {
  display: none;
  margin-top: 20px;
  padding: 13px;
  border-radius: 10px;
  background: #3b203f;
  color: #f3d6ff;
  font-size: 13px;
  line-height: 1.6;
}

.back {
  display: inline-block;
  margin-top: 25px;
  color: #d6b2fa;
  text-decoration: none;
}

.footer {
  margin-top: 30px;
  color: #9881aa;
  letter-spacing: 3px;
  font-size: 11px;
}
</style>
</head>

<body>

<div class="stars"></div>

<main class="container">

  <div class="tagline">A PRIVATE WORLD FOR TWO</div>

  <div class="heart">♡</div>

  <h1>Between Us</h1>

  <p class="subtitle">
    Two hearts.<br>
    One little universe.<br>
    A place only for us.
  </p>

  <section class="card">

    <h2>Welcome Back ❤️</h2>

    <p>Your little world is waiting for you.</p>

    <form id="loginForm">

      <label for="email">Your Email</label>
      <input type="email" id="email"
      placeholder="Enter your email" required>

      <label for="password">Your Password</label>
      <input type="password" id="password"
      placeholder="Enter your password" required>

      <button type="submit">
        Enter Our World ✨
      </button>

    </form>

    <div class="notice" id="notice">
      Our secure login system is being prepared.
      Please come back soon. ❤️
    </div>

  </section>

  <a href="index.html" class="back">
    ← Back to Our Beginning
  </a>

  <div class="footer">
    JUST US, ALWAYS · ♡
  </div>

</main>

<script>
document.getElementById("loginForm")
.addEventListener("submit", function(event) {
  event.preventDefault();
  document.getElementById("notice").style.display = "block";
});
</script>

</body>
</html>
